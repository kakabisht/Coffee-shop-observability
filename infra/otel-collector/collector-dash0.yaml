receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  pprof:
    server:
      endpoint: 0.0.0.0:4041

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:9464
    send_timestamps: true
    metric_expiration: 180m

  otlp/data-prepper:
    endpoint: data-prepper:21890
    tls:
      insecure: true

  otlp_grpc/dash0:
    endpoint: ${env:DASH0_OTLP_GRPC_ENDPOINT}
    headers:
      Authorization: Bearer ${env:DASH0_AUTH_TOKEN}
      Dash0-Dataset: ${env:DASH0_DATASET}
    sending_queue:
      enabled: true
    retry_on_failure:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlp_grpc/dash0]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, otlp_grpc/dash0]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/data-prepper, otlp_grpc/dash0]
    profiles:
      receivers: [otlp, pprof]
      exporters: [otlp_grpc/dash0]
